services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]

  api:
    build: .
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      SQLITE_PATH: /app/data/documind.db
      CORS_ORIGINS: '["http://localhost:8501"]'
    ports: ["8000:8000"]
    volumes: ["api_data:/app/data"]
    depends_on: [qdrant]

  ui:
    build: .
    command: ["streamlit", "run", "ui/streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      DOCUMIND_API_URL: http://api:8000
      DOCUMIND_API_KEY: ${API_KEY:-}
    ports: ["8501:8501"]
    depends_on: [api]

volumes:
  qdrant_data:
  api_data:
